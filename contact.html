<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Greenden Contact</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex flex-col min-h-screen">

  <!-- Navbar -->
  <nav class="flex justify-between items-center px-10 py-4 bg-white shadow">
    <h1 class="text-xl font-bold text-green-700">GREENDEN</h1>
    <ul class="flex gap-6 text-gray-700">
      <li><a href="#">Home</a></li>
      <li><a href="#">Products</a></li>
      <li><a href="#" class="font-semibold text-green-700">Contact</a></li>
    </ul>
  </nav>

  <!-- Contact Section -->
  <div class="flex-grow flex justify-center items-center py-12 px-4">
    <div class="bg-green-800 text-white w-full max-w-4xl p-8 rounded-lg shadow-lg">

      <!-- Heading -->
      <div class="mb-6">
        <h2 class="text-2xl font-semibold">Ask your Query</h2>
        <p class="text-sm text-green-200">We are happy to get in touch with you</p>
      </div>

      <!-- Form -->
      <form class="space-y-4">

        <div>
          <label class="block mb-1 text-sm">Full Name</label>
          <input type="text" class="w-full p-2 rounded text-black outline-none" />
        </div>

        <div>
          <label class="block mb-1 text-sm">Email Address</label>
          <input type="email" placeholder="email@domain.com"
            class="w-full p-2 rounded text-black outline-none" />
        </div>

        <div class="grid md:grid-cols-2 gap-4">
          <div>
            <label class="block mb-1 text-sm">Address / Street</label>
            <input type="text" class="w-full p-2 rounded text-black outline-none" />
          </div>
          <div>
            <label class="block mb-1 text-sm">City</label>
            <input type="text" class="w-full p-2 rounded text-black outline-none" />
          </div>
        </div>

        <div class="grid md:grid-cols-3 gap-4">
          <div>
            <label class="block mb-1 text-sm">Country / Region</label>
            <input type="text" placeholder="Country"
              class="w-full p-2 rounded text-black outline-none" />
          </div>
          <div>
            <label class="block mb-1 text-sm">State / Province</label>
            <input type="text" placeholder="State"
              class="w-full p-2 rounded text-black outline-none" />
          </div>
          <div>
            <label class="block mb-1 text-sm">Zipcode</label>
            <input type="text"
              class="w-full p-2 rounded text-black outline-none" />
          </div>
        </div>

        <div class="text-right">
          <button class="bg-black text-white px-5 py-2 rounded hover:bg-gray-800">
            Submit
          </button>
        </div>

      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-green-100 py-10 px-10">
  <div class="max-w-5xl">
    
    <h2 class="text-2xl font-bold text-gray-800 mb-3">
      Greenden
    </h2>

    <p class="text-gray-700 mb-4">
      The Standard chunk of Lorem ipsum used since the 1500s is reproduced below for those interest
    </p>

    <p class="text-gray-600 text-sm">
      @ 2021 Greenday.com
    </p>

  </div>
</footer>
</body>
</html>
